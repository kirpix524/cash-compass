<div class="modal fade" id="addWalletGroupModal" tabindex="-1" aria-labelledby="addWalletGroupModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="walletGroupForm" method="post">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="addWalletGroupModalLabel">Новая группа кошельков</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            {{ form.name.label_tag }}
            {{ form.name }}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>
